name: Guard main branch
on:
  push:
    branches: [main]
jobs:
  protect:
    if: ${{ !startsWith(github.event.head_commit.message, 'Merge') && !startsWith(github.event.head_commit.message, 'Revert') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git read-tree -u --reset ${{ github.event.before }}
          git commit -m "Revert accidental push to main"
          git push
